<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
            background: linear-gradient(135deg, #f7b4cf, #b4d8f6);
            color: #2c3650;
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-card {
            width: min(100%, 380px);
            padding: 38px;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 18px 50px rgba(48, 66, 112, 0.2);
        }

        h1 {
            margin: 0 0 8px;
            color: #4b83c4;
            font-size: 2rem;
        }

        .intro {
            margin: 0 0 28px;
            color: #778197;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            min-height: 48px;
            padding: 12px;
            border: 1px solid #dce2ed;
            border-radius: 10px;
            font: inherit;
        }

        input:focus-visible,
        button:focus-visible {
            outline: 3px solid rgba(75, 131, 196, 0.35);
            outline-offset: 2px;
        }

        .options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 4px 0 22px;
            font-size: 0.9rem;
        }

        .remember {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #778197;
        }

        input[type="checkbox"] {
            accent-color: #e875a5;
        }

        a {
            color: #4b83c4;
            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(100deg, #e875a5, #4b83c4);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        .signup {
            margin: 22px 0 0;
            color: #778197;
            font-size: 0.9rem;
            text-align: center;
        }

        @media (max-width: 420px) {
            .login-card {
                padding: 30px 24px;
            }
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>Log in</h1>
        <p class="intro">Welcome back! Please enter your details.</p>

        <form action="#" method="post">
            <div class="field">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
            </div>
            <div class="options">
                <label class="remember" for="remember">
                    <input id="remember" name="remember" type="checkbox">
                    Remember me
                </label>
                <a href="#forgot-password">Forgot password?</a>
            </div>
            <button type="submit">Log in</button>
        </form>

        <p class="signup">Don't have an account? <a href="#sign-up">Sign up</a></p>
    </main>
</body>
</html>
